name: Release

on:
  release:
    types: [published]

# Minimal default permissions — jobs override only what they need.
permissions: read-all

jobs:

  # ------------------------------------------------------------
  # BUILD
  # Publishes the WinUI 3 app self-contained, packages GUI + CLI
  # into ZIPs, builds the MSI installers, and uploads everything
  # to the GitHub Release.
  # ------------------------------------------------------------
  build:
    name: Build & upload release artifacts
    runs-on: windows-latest
    permissions:
      contents: write   # required to upload assets to the release
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The build runs code from NuGet packages; it has no need for the
          # write token that checkout would otherwise leave in .git/config.
          persist-credentials: false

      # The file names come from VERSION, the release from the tag. If they
      # disagree, 2.0.0 files would be attached to a v2.1.0 release.
      - name: Read version
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($env:TAG -ne "v$v" -and $env:TAG -ne $v) {
            Write-Error "Tag '$env:TAG' does not match VERSION '$v'. Update VERSION or re-tag."
            exit 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'

      # The MSI is built by WiX; -RequireMsi below turns a missing toolset
      # into a failed release rather than a release without its installer.
      # The OSMF EULA acceptance is explained in ci-cd.yml's installer-build job.
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 7.0.0

      - name: Build release (x64)
        shell: pwsh
        run: pwsh -File development/tools/Build-Release.ps1 -Architecture x64 -RequireMsi

      - name: Build release (arm64)
        shell: pwsh
        run: pwsh -File development/tools/Build-Release.ps1 -Architecture arm64 -Output dist-arm64 -RequireMsi

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:VERSION
          # Each architecture's build writes its own SHA256SUMS.txt. Publish
          # one file that covers every uploaded asset; the arm64 run's CLI ZIP
          # is a second build of the same scripts and is not uploaded.
          $sums = @(Get-Content dist/SHA256SUMS.txt) +
                  @(Get-Content dist-arm64/SHA256SUMS.txt | Where-Object { $_ -notmatch 'pcHealth-CLI-' })
          New-Item -ItemType Directory -Force release | Out-Null
          $sums | Set-Content release/SHA256SUMS.txt
          gh release upload $env:TAG `
            "dist/pcHealth-${v}-win-x64.msi" `
            "dist-arm64/pcHealth-${v}-win-arm64.msi" `
            "dist/pcHealth-${v}-win-x64.zip" `
            "dist-arm64/pcHealth-${v}-win-arm64.zip" `
            "dist/pcHealth-CLI-${v}.zip" `
            "release/SHA256SUMS.txt" `
            --clobber
